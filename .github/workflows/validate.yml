name: config 검증
on:
  pull_request:
    paths: ["app-config.json", "schema.json"]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install jsonschema
      - name: JSON 문법·스키마 검사
        run: |
          python3 - <<'PY'
          import json, sys, jsonschema
          try:
              cfg = json.load(open("app-config.json"))
          except Exception as e:
              sys.exit(f"JSON 문법 오류: {e}")
          jsonschema.validate(cfg, json.load(open("schema.json")))
          print(f"통과 — 안내 {len(cfg['notices'])}건")
          PY
